name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.10'
      - run: uv sync --locked
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - name: Build isolated synthetic snapshot and exercise its provenance chain
        run: uv run --locked python -m carteira_radar build --fixture --track
      - name: Build production Angular and serve the snapshot
        run: docker compose -p carteira-radar-ci up -d --build --wait --wait-timeout 90
      - run: python3 scripts/smoke.py
      - name: Verify the Angular runtime in Chromium
        run: |
          uv run --locked --with playwright==1.61.0 python -m playwright install --with-deps chromium
          uv run --locked --with playwright==1.61.0 python scripts/browser.py
      - name: Stop isolated environment
        if: always()
        run: docker compose -p carteira-radar-ci down
